apiVersion: v1
kind: ConfigMap
metadata:
  namespace: dpsrv
  name: mailserver-env
data:
  OVERRIDE_HOSTNAME: "smtp.maxf.net"
  POSTMASTER_ADDRESS: "max@maxf.net"
  LOG_LEVEL: "info"
  ENABLE_IMAP: "1"
  ENABLE_POP3: "0"
  ENABLE_CLAMAV: "0"
  ENABLE_RSPAMD: "1"
  ENABLE_AMAVIS: "0"
  ENABLE_SPAMASSASSIN: "0"
  ENABLE_FAIL2BAN: "0"
  ENABLE_QUOTAS: "1"
  SSL_TYPE: "manual"
  SSL_CERT_PATH: "/etc/ssl/mail/fullchain.pem"
  SSL_KEY_PATH: "/etc/ssl/mail/privkey.pem"
  PERMIT_DOCKER: "network"
  ONE_DIR: "1"
  SPOOF_PROTECTION: "1"
  ENABLE_SRS: "0"
  NETWORK_INTERFACE: ""
  TZ: "America/New_York"
  POSTFIX_mynetworks: "127.0.0.1/32 [::1]/128"
  POSTFIX_soft_bounce: "no"
  POSTFIX_notify_classes: "resource, software"
---
apiVersion: v1
kind: ConfigMap
metadata:
  namespace: dpsrv
  name: mailserver-postfix-master
data:
  postfix-master.cf: |
    submissions/inet/smtpd_client_restrictions=permit_sasl_authenticated,reject
    submissions/inet/smtpd_relay_restrictions=permit_sasl_authenticated,reject
    smtp/inet/smtpd_relay_restrictions=permit_sasl_authenticated,defer_unauth_destination
---
apiVersion: v1
kind: ConfigMap
metadata:
  namespace: dpsrv
  name: mailserver-user-patches
data:
  user-patches.sh: |
    #!/bin/bash
    # Ensure vmailbox is refreshed on startup
    sleep 5
    postmap /etc/postfix/vmailbox 2>/dev/null || true
    postfix reload 2>/dev/null || true
